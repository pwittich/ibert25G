ne points="1261,530 1312,530" fill="none" stroke="#007E87" stroke-width="2.77778" marker-end="url(#arrow-007E87)"/><polyline points="1312,590 1261,590" fill="none" stroke="#007E87" stroke-width="2.77778" marker-end="url(#arrow-007E87)"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="14.5833" font-weight="400" fill="#007E87"><tspan x="1036.5" y="652.125">Serial I/O: 25.78125 Gb/s</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="15.2778" font-weight="400" fill="#52677D"><tspan x="244.5" y="656.75">Clock-domain crossings use synchronizers / handshakes; management logic runs at 200 MHz.</tspan></text></svg>