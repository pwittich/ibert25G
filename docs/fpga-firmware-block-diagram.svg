<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 1334 520" role="img" aria-labelledby="title desc"><title id="title">All-links v2 FPGA firmware block diagram</title><desc id="desc">One VU13P: I2C accesses hardware mailbox/results and clock monitor. A 200-MHz MicroBlaze with 32-KiB BRAM supervises an AXI test engine. Four banks of 28 quad controllers manage 112 GTY lanes; lane results cross receive-clock domains coherently. External MCU and serial pins are outside the boundary.</desc><defs><marker id="arrow-007E87" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#007E87"/></marker><marker id="arrow-2565A7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2565A7"/></marker><marker id="arrow-C97714" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#C97714"/></marker><marker id="arrow-52677D" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#52677D"/></marker></defs><rect x="0" y="170" width="1334" height="520" fill="#F3F6FA"/><rect x="218" y="198" width="1065" height="483" rx="9" fill="#E5EDF5" stroke="#9AB0C5" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="19.4444" font-weight="700" fill="#2565A7"><tspan x="239.5" y="221.5">ONE VU13P FPGA  ·  same architecture at F1 and F2</tspan></text><rect x="50" y="302" width="142" height="135" rx="9" fill="#14283F" stroke="none" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="22.2222" font-weight="700" fill="#FFFFFF"><tspan x="66.5" y="335">Board MCU</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="19.4444" font-weight="400" fill="#FFFFFF"><tspan x="66.5" y="387.5">I2C5 + mux</tspan><tspan x="66.5" y="419.389">0x70</tspan></text><rect x="245" y="283" width="194" height="103" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="22.2222" font-weight="700" fill="#007E87"><tspan x="257.5" y="314">Generic I2C</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="18.0556" font-weight="400" fill="#23384E"><tspan x="257.5" y="355.25">7-bit slave 0x2B</tspan></text><rect x="245" y="428" width="194" height="97" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="20.8333" font-weight="700" fill="#007E87"><tspan x="257.5" y="455.75">Clock monitor</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="14.5833" font-weight="400" fill="#23384E"><tspan x="257.5" y="491.125">37 clocks · 0x08–0x9C</tspan></text><rect x="245" y="562" width="194" height="65" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="16.6667" font-weight="400" fill="#23384E"><tspan x="257.5" y="586">Clock / reset · MMCM</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="14.5833" font-weight="400" fill="#23384E"><tspan x="257.5" y="615.125">200 → 100 / 325 MHz</tspan></text><rect x="478" y="264" width="228" height="362" rx="9" fill="#D4E2F1" stroke="#9AB0C5" stroke-width="1.4"/><rect x="494" y="283" width="195" height="112" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><text font-family="Liberation Sans,Arial,sans-serif" font-size="23.6111" font-weight="700" fill="#2565A7"><tspan x="507.5" y="315.25">MicroBlaze</tspan></text><text font-family="Liberation Sans,Arial,sans-serif" font-size="18.0556" font-weight="400" fill="#23384E"><tspan x="507.5" y="357.25">200 MHz</tspan><tspan x="507.5" y="387.556">IRQ + Wakeup</tspan></text><rect x="494" y="457" width="195" height="95" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><text font-fam